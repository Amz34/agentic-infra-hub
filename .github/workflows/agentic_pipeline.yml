name: Agentic Infra CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      task_description:
        description: "Task description"
        required: true
        default: "Automated verification"

jobs:
  agentic-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stage 1 2 3 Autonomous Plan Analyze Execute
        env:
          INPUT_TASK: ${{ github.event.inputs.task_description }}
        run: |
          chmod +x agentic_engine.py
          TASK="${INPUT_TASK:-CI Triggered Autonomous Pipeline Run}"
          python3 agentic_engine.py --task "$TASK"

      - name: Verify Audit Manifest
        run: |
          test -f last_run_manifest.json
          test -f audit_trail.jsonl
          echo "Audit trail intact. Manifest verified."
